<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Info</title>
    <link rel="stylesheet" href="contactstyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="section-one">
            <h1 class="section-one__name">Suthirbarath</h1>
            <p class="section-one__role">Web developer</p>
            <a href="index.html" class="section-one__contact">Home</a>

        </div>

        <div class="section-two">
            <form>
                <table>
                    <tr>
                        <td>Name:</td>
                        <td>
                            <input type="text" placeholder=" Enter Your name" class="section-two__input">
                        </td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td>
                            <input type="email" placeholder=" Enter Your Email " class="section-two__input">
                        </td>
                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td>
                            <textarea placeholder="Message...." class="section-two__message"></textarea>
                        </td>
                    </tr>
                    <tr class="section-two__button">
                        <td></td>
                        <td>
                            <input type="submit" class="section-two__submit">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
        <div class="section-three">
            <h3 class="section-three__title">Social media:<a href="https://www.myntra.com">Instagram</a>,<a
                    href="https://www.pedigree.in/">Linkedin</a>
            </h3>
            <p class="section-three__desc">&copy;Suthirbarath</p>
        </div>
    </div>
</body>

</html>
